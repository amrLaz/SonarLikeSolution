trigger:
  branches:
    include:
      - master
      - main
      - testdecoration

pr:
  branches:
    include:
      - master
      - main
      - testdecoration

pool:
  vmImage: ubuntu-latest

variables:
  PLATFORM_PROJECT_KEY: "TESTPROJECT"
  PLATFORM_API_URL: "https://purchase-banner-hacked.ngrok-free.dev"
  PLATFORM_API_TOKEN: "Lq_LR3rERrYteDAHFFulBODlGe5xiNWwNsCqWy8oXM4"
  PLATFORM_REPO_PROVIDER: "azure-devops"
  PLATFORM_PIPELINE_PROVIDER: "azure-devops"
  PLATFORM_SCAN_TARGET: "apps"
  PLATFORM_SCAN_IGNORE: "scripts/ci_platform_scan.py,**/ci_platform_scan.py"

stages:
  - stage: Analysis
    displayName: "Platform Analysis"
    jobs:
      - job: PrepareAndRun
        displayName: "Prepare + Run Analysis"
        steps:
          - checkout: self
            fetchDepth: 1

          - task: UseNode@1
            inputs:
              version: "18.x"
            displayName: "Setup Node.js"

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"

          - script: |
              if [ -z "$PLATFORM_API_URL" ] || [ -z "$PLATFORM_API_TOKEN" ]; then
                echo "ERROR: PLATFORM_API_URL and PLATFORM_API_TOKEN must be set as pipeline variables."
                exit 1
              fi
              echo "Platform credentials present. URL: $PLATFORM_API_URL"
            displayName: "Validate Platform credentials"
            env:
              PLATFORM_API_URL: $(PLATFORM_API_URL)
              PLATFORM_API_TOKEN: $(PLATFORM_API_TOKEN)

          - script: |
              python -m pip install --upgrade pip
              pip install semgrep bandit pylint radon
            displayName: "Install SAST scanners"

          - script: |
              echo "=== Generating Coverage Reports ==="
              
              # Install jscpd globally for duplication detection
              echo "📦 Installing jscpd for duplication analysis..."
              npm install -g jscpd 2>&1 | tail -5 || echo "⚠️ jscpd install had issues"
              
              # Python coverage (if pytest available)
              if [ -f "pytest.ini" ] || [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
                echo "📦 Generating Python coverage..."
                pip install pytest pytest-cov coverage 2>/dev/null || true
                if pytest --cov=scripts --cov-report=term --cov-report=html --cov-report=xml; then
                  echo "✅ Python coverage generated"
                else
                  echo "⚠️ pytest not available or tests failed"
                fi
              fi
              
              # JavaScript/TypeScript coverage - check multiple locations
              # Priority 1: apps/web (NewSASTProject structure)
              if [ -d "apps/web" ] && [ -f "apps/web/package.json" ]; then
                echo "📦 Generating JS/TS coverage for apps/web..."
                cd apps/web
              # Priority 2: Root directory (Commercant.Web structure)
              elif [ -f "package.json" ]; then
                echo "📦 Generating JS/TS coverage from root..."
              else
                echo "❌ No package.json found"
                exit 0
              fi
              
              # Install dependencies with verbose output
              echo "  Installing dependencies..."
              if npm install --legacy-peer-deps 2>&1 | tail -10; then
                echo "  ✅ Dependencies installed"
              else
                echo "  ⚠️ npm install failed"
              fi
              
              # Run tests with coverage
              echo "  Checking test scripts..."
              if grep -q '"test:coverage"' package.json; then
                echo "  📋 Running 'npm run test:coverage'..."
                npm run test:coverage 2>&1 | tail -50 || echo "  test:coverage exit code: $?"
                echo "  ✅ test:coverage completed"
              elif grep -q '"test"' package.json; then
                echo "  📋 Running 'npm test'..."
                npm test 2>&1 | tail -50 || echo "  npm test exit code: $?"
                echo "  ✅ npm test completed"
              else
                echo "  ⚠️ No test script found, trying npx jest"
                npx jest --coverage --forceExit 2>&1 | tail -50 || echo "  jest exit code: $?"
              fi
              
              # Check for coverage reports and handle both structures
              echo "  Looking for coverage reports..."
              COVERAGE_FOUND=false
              
              for pattern in "coverage/coverage-final.json" "coverage-jest/coverage-jest.json" "coverage/coverage-jest.json"; do
                if [ -f "$pattern" ]; then
                  echo "  ✅ Found: $pattern"
                  COVERAGE_FOUND=true
                  
                  # If we're in apps/web, copy back to root
                  if [ "$(pwd)" = "$(cd ../../ && pwd)/apps/web" ]; then
                    mkdir -p ../../coverage
                    cp "$pattern" "../../coverage/$(basename $pattern)"
                    echo "    Copied to root coverage directory"
                  fi
                  break
                fi
              done
              
              if [ "$COVERAGE_FOUND" = false ]; then
                echo "  ❌ No coverage report found"
                echo "    Checked: coverage/coverage-final.json, coverage-jest/coverage-jest.json, coverage/coverage-jest.json"
                echo "    Working directory: $(pwd)"
                echo "    Files: $(ls -la 2>/dev/null | grep -E 'coverage|package.json|jest' | head -10 || echo 'none')"
              fi
              
              # Return to root if we went to apps/web
              if [ -d "../../scripts" ]; then
                cd ../../
              fi
              
              echo "✅ Coverage generation complete"
            displayName: "Generate Code Coverage Reports"
            continueOnError: true

          - script: |
              python scripts/ci_platform_scan.py full-test
            displayName: "Platform: Prepare + Analyze + Test"
            env:
              PLATFORM_API_URL: $(PLATFORM_API_URL)
              PLATFORM_API_TOKEN: $(PLATFORM_API_TOKEN)
              PLATFORM_PROJECT_KEY: $(PLATFORM_PROJECT_KEY)
              PLATFORM_REPO_PROVIDER: $(PLATFORM_REPO_PROVIDER)
              PLATFORM_PIPELINE_PROVIDER: $(PLATFORM_PIPELINE_PROVIDER)
              PLATFORM_REPO_URL: $(Build.Repository.Uri)
              PLATFORM_PIPELINE_URL: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=results
              CI_PROVIDER: azure-devops
              PLATFORM_SCAN_TARGET: $(PLATFORM_SCAN_TARGET)
              PLATFORM_SCAN_IGNORE: $(PLATFORM_SCAN_IGNORE)
              PLATFORM_REAL_SAST: "true"
              # PR decoration context (populated automatically by ADO in PR builds)
              SYSTEM_PULLREQUEST_PULLREQUESTID: $(System.PullRequest.PullRequestId)
              SYSTEM_TEAMPROJECT: $(System.TeamProject)
              BUILD_REPOSITORY_ID: $(Build.Repository.ID)
              SYSTEM_PULLREQUEST_TARGETBRANCHNAME: $(System.PullRequest.TargetBranchName)
              SYSTEM_PULLREQUEST_TARGETBRANCH: $(System.PullRequest.TargetBranch)
              BUILD_SOURCEBRANCH: $(Build.SourceBranch)
              BUILD_REASON: $(Build.Reason)
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
