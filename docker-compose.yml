services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sast_user
      POSTGRES_PASSWORD: sast_password
      POSTGRES_DB: sast_platform
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: newsastproject-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://sast_user:sast_password@db:5432/sast_platform
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: sast_user
      POSTGRES_PASSWORD: sast_password
      POSTGRES_DB: sast_platform
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      WORKER_POLL_SECONDS: "5"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      - db
      - redis

  worker:
    image: newsastproject-worker
    command: python -m app.main
    environment:
      DATABASE_URL: postgresql+psycopg://sast_user:sast_password@db:5432/sast_platform
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: sast_user
      POSTGRES_PASSWORD: sast_password
      POSTGRES_DB: sast_platform
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WORKER_POLL_SECONDS: "5"
    depends_on:
      - db
      - redis

  web:
    image: newsastproject-web
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/src
    depends_on:
      - api

volumes:
  db_data:
