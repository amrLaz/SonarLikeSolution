parameters:
  - name: stageName
    type: string
    default: Analysis

  - name: templatesRepoAlias
    type: string
    default: SonarLikeSolution

  - name: projectKey
    type: string

  - name: apiUrl
    type: string

  - name: apiToken
    type: string

  - name: repoProvider
    type: string
    default: azure-devops

  - name: pipelineProvider
    type: string
    default: azure-devops

  - name: scanTarget
    type: string
    default: src

  - name: scanIgnore
    type: string
    default: scripts/ci_platform_scan.py,**/ci_platform_scan.py

  - name: realSast
    type: string
    default: "true"

  - name: pythonVersion
    type: string
    default: "3.12"

  - name: nodeVersion
    type: string
    default: "18.x"

stages:
  - stage: ${{ parameters.stageName }}
    displayName: Platform Analysis
    jobs:
      - job: PrepareAndRun
        displayName: Prepare + Run Analysis
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 1

          - checkout: ${{ parameters.templatesRepoAlias }}
            fetchDepth: 1

          - task: UseNode@1
            inputs:
              version: ${{ parameters.nodeVersion }}
            displayName: Setup Node.js

          - task: UsePythonVersion@0
            inputs:
              versionSpec: ${{ parameters.pythonVersion }}

          - script: |
              if [ -z "$PLATFORM_API_URL" ] || [ -z "$PLATFORM_API_TOKEN" ]; then
                echo "ERROR: PLATFORM_API_URL and PLATFORM_API_TOKEN must be set as pipeline variables."
                exit 1
              fi
              echo "Platform credentials present. URL: $PLATFORM_API_URL"
            displayName: Validate Platform credentials
            env:
              PLATFORM_API_URL: ${{ parameters.apiUrl }}
              PLATFORM_API_TOKEN: ${{ parameters.apiToken }}

          - task: npmAuthenticate@0
            inputs:
              workingFile: .npmrc
            displayName: Authenticate NPM (Azure DevOps Registry)
            continueOnError: true

          - script: |
              python -m pip install --upgrade pip
              pip install semgrep bandit pylint radon
            displayName: Install SAST scanners

          - script: |
              set -e
              cd "$(Build.Repository.LocalPath)"
              SCRIPT_PATH="$(Pipeline.Workspace)/s/${{ parameters.templatesRepoAlias }}/scripts/ci_platform_scan.py"
              python "$SCRIPT_PATH" full-test
            displayName: Platform: Prepare + Analyze + Test
            env:
              PLATFORM_API_URL: ${{ parameters.apiUrl }}
              PLATFORM_API_TOKEN: ${{ parameters.apiToken }}
              PLATFORM_PROJECT_KEY: ${{ parameters.projectKey }}
              PLATFORM_REPO_PROVIDER: ${{ parameters.repoProvider }}
              PLATFORM_PIPELINE_PROVIDER: ${{ parameters.pipelineProvider }}
              PLATFORM_REPO_URL: $(Build.Repository.Uri)
              PLATFORM_PIPELINE_URL: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=results
              CI_PROVIDER: azure-devops
              PLATFORM_SCAN_TARGET: ${{ parameters.scanTarget }}
              PLATFORM_SCAN_IGNORE: ${{ parameters.scanIgnore }}
              PLATFORM_REAL_SAST: ${{ parameters.realSast }}
              SYSTEM_PULLREQUEST_PULLREQUESTID: $(System.PullRequest.PullRequestId)
              SYSTEM_TEAMPROJECT: $(System.TeamProject)
              BUILD_REPOSITORY_ID: $(Build.Repository.ID)
              SYSTEM_PULLREQUEST_TARGETBRANCHNAME: $(System.PullRequest.TargetBranchName)
              SYSTEM_PULLREQUEST_TARGETBRANCH: $(System.PullRequest.TargetBranch)
              BUILD_SOURCEBRANCH: $(Build.SourceBranch)
              BUILD_REASON: $(Build.Reason)
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
