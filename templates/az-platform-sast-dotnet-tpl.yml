# az-platform-sast-dotnet-tpl.yml
# Stack-specific SAST wrapper for .NET / Blazor / C# projects.
#
# Runs Roslyn analyzers (via dotnet build), dotnet package audit (NuGet CVEs),
# and semgrep/detect-secrets. Skips Node.js and Python tooling entirely.
#
# Usage in your pipeline:
#   - template: DevSecOps/az-platform-sast-dotnet-tpl.yml@AzPipelinesTpl
#     parameters:
#       scan_target: '.'
#       dotnet_analysis_mode: Recommended  # or All / Default

parameters:
  - name: shared_repository_alias
    displayName: Shared repository alias
    type: string
    default: AzPipelinesTpl
  - name: shared_checkout_path
    displayName: Shared repository checkout path
    type: string
    default: shared/azure-pipelines
  - name: scan_mode
    displayName: Scan mode
    type: string
    default: full-test
  - name: scan_target
    displayName: Scan target path
    type: string
    default: .
  - name: scan_ignore
    displayName: Scan ignore patterns
    type: string
    default: ''
  - name: fail_on_error
    displayName: Fail pipeline when scanner errors
    type: boolean
    default: true
  - name: dotnet_analysis_mode
    displayName: Roslyn analysis mode (Default | Recommended | All)
    type: string
    default: Recommended
  - name: trivy_enabled
    displayName: Enable Trivy multi-ecosystem CVE scan
    type: boolean
    default: true

steps:
  - template: az-platform-sast-steps-tpl.yml@${{ parameters.shared_repository_alias }}
    parameters:
      shared_repository_alias: ${{ parameters.shared_repository_alias }}
      shared_checkout_path: ${{ parameters.shared_checkout_path }}
      enable_node: false
      npm_authenticate: false
      scan_mode: ${{ parameters.scan_mode }}
      scan_target: ${{ parameters.scan_target }}
      scan_ignore: ${{ parameters.scan_ignore }}
      fail_on_error: ${{ parameters.fail_on_error }}
      language_stack: dotnet
      trivy_enabled: ${{ parameters.trivy_enabled }}
      dotnet_analysis_mode: ${{ parameters.dotnet_analysis_mode }}
