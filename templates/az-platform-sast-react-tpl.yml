# az-platform-sast-react-tpl.yml
# Stack-specific SAST wrapper for React / TypeScript projects.
#
# Pre-installs eslint-plugin-security so security rules are available even if
# the app's devDependencies don't include it. Delegates to the common engine
# template with language_stack=react-ts so only TS/JS analyzers + npm audit run.
#
# Usage in your pipeline:
#   - template: DevSecOps/az-platform-sast-react-tpl.yml@AzPipelinesTpl
#     parameters:
#       npm_authenticate: true      # set to true if you use a private npm registry
#       npmrc_path: '.npmrc'
#       scan_target: '.'

parameters:
  - name: shared_repository_alias
    displayName: Shared repository alias
    type: string
    default: AzPipelinesTpl
  - name: shared_checkout_path
    displayName: Shared repository checkout path
    type: string
    default: shared/azure-pipelines
  - name: node_version
    displayName: Node.js version
    type: string
    default: 20.x
  - name: npm_authenticate
    displayName: Enable npm authentication (private registry)
    type: boolean
    default: false
  - name: npmrc_path
    displayName: Path to .npmrc from app root
    type: string
    default: .npmrc
  - name: scan_mode
    displayName: Scan mode
    type: string
    default: full-test
  - name: scan_target
    displayName: Scan target path
    type: string
    default: .
  - name: scan_ignore
    displayName: Scan ignore patterns
    type: string
    default: ''
  - name: fail_on_error
    displayName: Fail pipeline when scanner errors
    type: boolean
    default: true
  - name: trivy_enabled
    displayName: Enable Trivy multi-ecosystem CVE scan
    type: boolean
    default: true

steps:
  # Ensure eslint-plugin-security is available for ESLint security rule classification.
  # This is installed globally so it is found even if the project does not declare it.
  - script: |
      npm install -g eslint-plugin-security --prefer-offline 2>/dev/null || true
    displayName: 'Platform: Pre-install eslint-plugin-security'
    continueOnError: true

  - template: az-platform-sast-steps-tpl.yml@${{ parameters.shared_repository_alias }}
    parameters:
      shared_repository_alias: ${{ parameters.shared_repository_alias }}
      shared_checkout_path: ${{ parameters.shared_checkout_path }}
      enable_node: true
      node_version: ${{ parameters.node_version }}
      npm_authenticate: ${{ parameters.npm_authenticate }}
      npmrc_path: ${{ parameters.npmrc_path }}
      scan_mode: ${{ parameters.scan_mode }}
      scan_target: ${{ parameters.scan_target }}
      scan_ignore: ${{ parameters.scan_ignore }}
      fail_on_error: ${{ parameters.fail_on_error }}
      language_stack: react-ts
      trivy_enabled: ${{ parameters.trivy_enabled }}
