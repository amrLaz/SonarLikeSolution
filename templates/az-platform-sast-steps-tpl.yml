parameters:
  - name: shared_repository_alias
    displayName: Shared repository alias
    type: string
    default: AzPipelinesTpl
  - name: shared_checkout_path
    displayName: Shared repository checkout path
    type: string
    default: shared/azure-pipelines
  - name: python_version
    displayName: Python version
    type: string
    default: 3.x
  - name: enable_node
    displayName: Enable Node.js setup
    type: boolean
    default: false
  - name: node_version
    displayName: Node.js version
    type: string
    default: 20.x
  - name: npm_authenticate
    displayName: Enable npm authentication
    type: boolean
    default: false
  - name: npmrc_path
    displayName: Path to .npmrc from app root
    type: string
    default: .npmrc
  - name: scan_mode
    displayName: Scan mode
    type: string
    default: full-test
  - name: scan_target
    displayName: Scan target path
    type: string
    default: .
  - name: scan_ignore
    displayName: Scan ignore patterns
    type: string
    default: ''
  - name: fail_on_error
    displayName: Fail pipeline when scanner errors
    type: boolean
    default: true
  - name: language_stack
    displayName: Language stack hint (react-ts | dotnet | php | empty = auto)
    type: string
    default: ''
  - name: trivy_enabled
    displayName: Enable Trivy multi-ecosystem CVE scan
    type: boolean
    default: true
  - name: dotnet_analysis_mode
    displayName: Roslyn analysis mode (Default | Recommended | All)
    type: string
    default: Recommended

steps:
  - checkout: ${{ parameters.shared_repository_alias }}
    fetchDepth: 0
    path: ${{ parameters.shared_checkout_path }}

  - task: UsePythonVersion@0
    displayName: Use Python ${{ parameters.python_version }}
    inputs:
      versionSpec: ${{ parameters.python_version }}
      addToPath: true

  - ${{ if eq(parameters.enable_node, true) }}:
      - task: UseNode@1
        displayName: Use Node ${{ parameters.node_version }}
        inputs:
          version: ${{ parameters.node_version }}

  - ${{ if eq(parameters.npm_authenticate, true) }}:
      - task: npmAuthenticate@0
        displayName: Authenticate npm
        continueOnError: true
        inputs:
          workingFile: $(Build.SourcesDirectory)/${{ parameters.npmrc_path }}

  - script: |
      set -e
      APP_ROOT="$(Build.SourcesDirectory)"
      SHARED_ROOT="$(Pipeline.Workspace)/${{ parameters.shared_checkout_path }}"
      REPO_NAME="$(Build.Repository.Name)"

      # In multi-repo checkout (self + shared templates repo), Azure DevOps
      # nests the self repo into a subfolder named after it instead of
      # putting it directly under Build.SourcesDirectory.
      if [ ! -d "$APP_ROOT/.git" ] && [ -d "$APP_ROOT/$REPO_NAME/.git" ]; then
        APP_ROOT="$APP_ROOT/$REPO_NAME"
      fi

      echo "Application root: $APP_ROOT"
      echo "Shared root: $SHARED_ROOT"

      if [ ! -f "$SHARED_ROOT/DevSecOps/ci_platform_scan.py" ]; then
        echo "##vso[task.logissue type=error]Shared scanner not found in $SHARED_ROOT/DevSecOps/ci_platform_scan.py"
        exit 1
      fi

      cd "$APP_ROOT"
      export PLATFORM_APP_REPO_ROOT="$APP_ROOT"
      python3 "$SHARED_ROOT/DevSecOps/ci_platform_scan.py" "${{ parameters.scan_mode }}"
    displayName: 'Platform: Prepare + Analyze + Test'
    continueOnError: ${{ not(parameters.fail_on_error) }}
    env:
      PLATFORM_PROJECT_KEY: $(PLATFORM_PROJECT_KEY)
      PLATFORM_API_URL: $(PLATFORM_API_URL)
      PLATFORM_API_TOKEN: $(PLATFORM_API_TOKEN)
      PLATFORM_REPO_PROVIDER: $(PLATFORM_REPO_PROVIDER)
      PLATFORM_REPO_URL: $(Build.Repository.Uri)
      PLATFORM_PIPELINE_PROVIDER: $(PLATFORM_PIPELINE_PROVIDER)
      PLATFORM_PIPELINE_URL: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)
      PLATFORM_SCAN_TARGET: ${{ parameters.scan_target }}
      PLATFORM_SCAN_IGNORE: ${{ parameters.scan_ignore }}
      PLATFORM_REAL_SAST: 'true'
      PLATFORM_LANGUAGE_STACK: ${{ parameters.language_stack }}
      PLATFORM_TRIVY_ENABLED: ${{ parameters.trivy_enabled }}
      PLATFORM_DOTNET_ANALYSIS_MODE: ${{ parameters.dotnet_analysis_mode }}