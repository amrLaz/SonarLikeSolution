# az-platform-sast-php-tpl.yml
# Stack-specific SAST wrapper for PHP projects.
#
# 1. Runs composer install --no-dev so vendor/bin tools and composer audit work.
# 2. Installs phpstan, phpcs, phpmd and psalm globally and adds composer's
#    global bin directory to PATH via ##vso[task.prependpath] so the scanner
#    can find them in the subsequent step.
# 3. Delegates to the common engine with language_stack=php.
#
# Usage in your pipeline:
#   - template: DevSecOps/az-platform-sast-php-tpl.yml@AzPipelinesTpl
#     parameters:
#       scan_target: '.'

parameters:
  - name: shared_repository_alias
    displayName: Shared repository alias
    type: string
    default: AzPipelinesTpl
  - name: shared_checkout_path
    displayName: Shared repository checkout path
    type: string
    default: shared/azure-pipelines
  - name: scan_mode
    displayName: Scan mode
    type: string
    default: full-test
  - name: scan_target
    displayName: Scan target path
    type: string
    default: .
  - name: scan_ignore
    displayName: Scan ignore patterns
    type: string
    default: ''
  - name: fail_on_error
    displayName: Fail pipeline when scanner errors
    type: boolean
    default: true
  - name: trivy_enabled
    displayName: Enable Trivy multi-ecosystem CVE scan
    type: boolean
    default: true

steps:
  - script: |
      set -e
      APP_ROOT="$(Build.SourcesDirectory)"
      REPO_NAME="$(Build.Repository.Name)"
      if [ ! -d "$APP_ROOT/.git" ] && [ -d "$APP_ROOT/$REPO_NAME/.git" ]; then
        APP_ROOT="$APP_ROOT/$REPO_NAME"
      fi
      cd "$APP_ROOT"

      # ── Step 0: install PCOV for PHP code-coverage ────────────────────────
      # PCOV is a lightweight PHP extension that instruments code for coverage.
      # Prefer it over Xdebug for CI (10-50× faster).
      PHP_VER=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;' 2>/dev/null || true)
      if [ -n "$PHP_VER" ]; then
        echo "PHP version: $PHP_VER — installing PCOV..."
        (apt-get install -y "php${PHP_VER}-pcov" 2>/dev/null) || \
        (pecl install pcov 2>/dev/null && echo "extension=pcov.so" >> "$(php -r 'echo php_ini_loaded_file();')") || true
        php -m 2>/dev/null | grep -qi pcov && echo "✅ PCOV available" || echo "⚠️ PCOV not available (coverage may be 0%)"
      fi

      # ── Step 1: install project dependencies (including dev) ───────────────
      # Install WITH dev deps so PHPUnit is available in vendor/bin.
      # composer audit will still scan all installed packages.
      if [ -f "composer.lock" ]; then
        echo "Installing project dependencies (including dev for PHPUnit)..."
        composer install --no-interaction --no-progress --optimize-autoloader 2>&1 | tail -5 || true
      fi

      # ── Step 2: install PHP SAST tools globally ────────────────────────────
      # Only install what is not already present (vendor/bin or PATH).
      MISSING=""
      for TOOL in phpstan phpcs phpmd psalm; do
        if [ ! -f "vendor/bin/$TOOL" ] && ! command -v "$TOOL" >/dev/null 2>&1; then
          case "$TOOL" in
            phpstan) MISSING="$MISSING phpstan/phpstan" ;;
            phpcs)   MISSING="$MISSING squizlabs/php_codesniffer" ;;
            phpmd)   MISSING="$MISSING phpmd/phpmd" ;;
            psalm)   MISSING="$MISSING vimeo/psalm" ;;
          esac
        fi
      done

      if [ -n "$MISSING" ]; then
        echo "Installing globally:$MISSING"
        composer global require $MISSING --no-interaction --no-progress 2>&1 | tail -15 || true
      else
        echo "All PHP SAST tools already available."
      fi

      # ── Step 3: add global composer bin to PATH for subsequent steps ───────
      GLOBAL_BIN="$(composer global config bin-dir --absolute 2>/dev/null)"
      if [ -n "$GLOBAL_BIN" ] && [ -d "$GLOBAL_BIN" ]; then
        echo "Composer global bin: $GLOBAL_BIN"
        echo "##vso[task.prependpath]$GLOBAL_BIN"
      fi
    displayName: 'Platform: Install PHP deps + SAST tools'
    continueOnError: true

  - template: az-platform-sast-steps-tpl.yml@${{ parameters.shared_repository_alias }}
    parameters:
      shared_repository_alias: ${{ parameters.shared_repository_alias }}
      shared_checkout_path: ${{ parameters.shared_checkout_path }}
      enable_node: false
      npm_authenticate: false
      scan_mode: ${{ parameters.scan_mode }}
      scan_target: ${{ parameters.scan_target }}
      scan_ignore: ${{ parameters.scan_ignore }}
      fail_on_error: ${{ parameters.fail_on_error }}
      language_stack: php
      trivy_enabled: ${{ parameters.trivy_enabled }}
