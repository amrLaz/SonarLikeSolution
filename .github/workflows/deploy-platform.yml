# ─────────────────────────────────────────────────────────────────────────────
# SAST Platform — CI/CD (GitHub Actions)
#
# Triggers on push to main/master touching the app or Dockerfile.
# Builds the combined Docker image, pushes to ACR, deploys to App Service.
#
# GitHub Secrets to configure (Settings → Secrets and variables → Actions):
#   AZURE_CREDENTIALS          JSON output of:
#                               az ad sp create-for-rbac \
#                                 --name "sp-sast-github" \
#                                 --role contributor \
#                                 --scopes /subscriptions/<id>/resourceGroups/rg-sast-prod \
#                                 --sdk-auth
#   ACR_USERNAME               az acr credential show --name upgroup --query username -o tsv
#   ACR_PASSWORD               az acr credential show --name upgroup --query passwords[0].value -o tsv
#
# GitHub Variables (Settings → Secrets and variables → Variables):
#   ACR_LOGIN_SERVER           upgroup.azurecr.io
#   APP_SERVICE_NAME           sast-app-prod
#   AZURE_RESOURCE_GROUP       rg-sast-prod
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy SAST Platform

on:
  push:
    branches: [main, master]
    paths:
      - "apps/api/**"
      - "apps/web/src/**"
      - "apps/web/index.html"
      - "apps/web/vite.config.ts"
      - "apps/web/tsconfig.json"
      - "Dockerfile"
      - ".github/workflows/deploy-platform.yml"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force image rebuild even without code changes"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never interrupt an in-progress deploy

env:
  IMAGE_NAME: sast-platform
  IMAGE_TAG: ${{ github.run_number }}

jobs:
  # ── Job 1: Build & push Docker image to ACR ──────────────────────────────
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ── Job 2: Deploy to Azure App Service ────────────────────────────────────
  deploy:
    name: Deploy to App Service
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://${{ vars.APP_SERVICE_NAME }}.azurewebsites.net

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_SERVICE_NAME }}
          images: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}

      - name: Restart App Service
        run: |
          az webapp restart \
            --name ${{ vars.APP_SERVICE_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}

      - name: Print platform URL
        run: |
          echo ""
          echo "════════════════════════════════════════════════════"
          echo "  ✅ Deployment complete"
          echo "  Platform URL: https://${{ vars.APP_SERVICE_NAME }}.azurewebsites.net"
          echo ""
          echo "  → Update PLATFORM_API_URL in your Azure DevOps"
          echo "    Variable Group (Commercant.Common) to this URL."
          echo "════════════════════════════════════════════════════"

  # ── Job 3: Terraform (infrastructure changes only, manual trigger) ────────
  terraform:
    name: Terraform plan/apply
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        working-directory: deploy/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: deploy/terraform
        env:
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        working-directory: deploy/terraform
        env:
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: terraform apply -auto-approve -input=false tfplan
