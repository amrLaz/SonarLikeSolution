# ─────────────────────────────────────────────────────────────────────────────
# SAST Platform — CI/CD (GitHub Actions)
#
# Ce que fait cette pipeline, étape par étape :
#
#   Déclencheur : push sur main/master touchant le code applicatif ou le Dockerfile
#
#   Job 1 — build
#     1. Checkout du code source (GitHub)
#     2. Authentification Azure via le SP (secret AZURE_CREDENTIALS)
#     3. Login ACR via token exposé par az acr login (pas besoin de ACR admin creds)
#     4. Build Docker multi-stage (Node → React SPA + Python → FastAPI)
#     5. Push de l'image vers ACR avec deux tags :
#          upgroup.azurecr.io/sast-platform:<numéro-de-build>   ← tag immuable
#          upgroup.azurecr.io/sast-platform:latest               ← tag flottant
#     6. Cache layers dans ACR → rebuilds rapides (~2 min)
#
#   Job 2 — deploy  (dépend de job 1)
#     1. Mise à jour de la revision active du Container App avec le tag immuable
#     2. Affichage de l'URL de la plateforme
#
# Infra (Terraform) : gérée dans devops-governance/sast-platform/
#
# GitHub Environment "SAST-Plateform" — secrets et variables à configurer :
#
#   Secrets :
#     AZURE_CREDENTIALS     JSON du SP :
#                             az ad sp create-for-rbac --name "sp-sast-github" \
#                               --role contributor \
#                               --scopes /subscriptions/6936e3c2-.../resourceGroups/up-france-odi-sast-prod-rg \
#                               --sdk-auth
#     ACR_LOGIN_SERVER      upgroup.azurecr.io
#     CONTAINER_APP_NAME    up-france-odi-sast-prod-app  (output Terraform : container_app_name)
#
#   Variables :
#     AZURE_RESOURCE_GROUP  up-france-odi-sast-prod-rg
#
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy SAST Platform

on:
  push:
    branches: [main, master]
    paths:
      - "apps/api/**"
      - "apps/web/src/**"
      - "apps/web/index.html"
      - "apps/web/vite.config.ts"
      - "apps/web/tsconfig.json"
      - "Dockerfile"
      - ".github/workflows/deploy-platform.yml"

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Forcer un rebuild même sans changement de code"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false   # ne jamais interrompre un déploiement en cours

env:
  IMAGE_NAME: sast-platform
  IMAGE_TAG: ${{ github.run_number }}

jobs:
  # ── Job 1 : Build & push l'image Docker vers ACR ─────────────────────────
  build:
    name: "Build & push image → ACR"
    runs-on: ubuntu-latest
    environment: SAST-Plateform   # donne accès aux secrets de l'environnement
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}

    steps:
      - name: "1. Checkout"
        uses: actions/checkout@v4

      - name: "2. Login Azure (SP)"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "3. Login ACR via SP token"
        run: |
          TOKEN=$(az acr login \
            --name "$(echo '${{ secrets.ACR_LOGIN_SERVER }}' | cut -d. -f1)" \
            --expose-token --output tsv --query accessToken)
          echo "$TOKEN" | docker login "${{ secrets.ACR_LOGIN_SERVER }}" \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: "4. Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "5. Build multi-stage + push"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ── Job 2 : Déployer la nouvelle image sur Azure Container Apps ────────────
  deploy:
    name: "Deploy → Container Apps"
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: SAST-Plateform
      url: https://${{ secrets.CONTAINER_APP_NAME }}.azurecontainerapps.io

    steps:
      - name: "1. Login Azure (SP)"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "2. Mettre à jour le Container App avec la nouvelle image"
        run: |
          az containerapp update \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"

      - name: "3. Vérifier que la révision est active"
        run: |
          az containerapp revision list \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[0].{name:name, state:properties.runningState, replicas:properties.replicas}" \
            --output table

      - name: "4. URL de la plateforme"
        run: |
          FQDN=$(az containerapp show \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  Déploiement terminé — image :${{ needs.build.outputs.image_tag }}"
          echo "  Platform URL : https://${FQDN}"
          echo ""
          echo "  → Mettre à jour PLATFORM_API_URL dans le Variable Group"
          echo "    Commercant.Common (Azure DevOps) avec cette URL."
          echo "════════════════════════════════════════════════════════"
