name: CodeInsights_Infra_$(date:yyyyMMdd)$(rev:.r)

parameters:
  - name: apply
    type: boolean
    default: false
  - name: recreateDatabase
    type: boolean
    default: false

trigger:
  branches:
    include: [master]
  paths:
    include: [infra/**]
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: CodeInsights.Infrastructure

steps:
  - checkout: self
  - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
    inputs:
      terraformVersion: '1.15.8'
  - task: AzureCLI@2
    displayName: Validate, plan and apply CodeInsights infrastructure
    inputs:
      azureSubscription: Subscription Fabrik
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      workingDirectory: $(Build.SourcesDirectory)/infra
      inlineScript: |
        set -euo pipefail
        export ARM_CLIENT_ID="$servicePrincipalId" ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        if [ -n "${idToken:-}" ]; then
          export ARM_USE_OIDC=true ARM_OIDC_TOKEN="$idToken"
        else
          export ARM_CLIENT_SECRET="$servicePrincipalKey"
        fi
        terraform init -input=false -lockfile=readonly -backend-config=variables/backend-production.tfvars
        terraform fmt -check -recursive
        terraform validate -no-color
        RECREATE_DATABASE="${RECREATE_DATABASE,,}"
        APPLY="${APPLY,,}"
        replace=()
        if [ "$RECREATE_DATABASE" = true ]; then
          replace=(-replace=azurerm_postgresql_flexible_server_database.app)
        fi
        terraform plan -input=false -no-color -var-file=variables/production.tfvars "${replace[@]}" -out=tfplan
        terraform show -json tfplan | jq -e --arg recreate "$RECREATE_DATABASE" '
          [.resource_changes[]? | select(.change.actions | index("delete")) | .address]
          | all(. == "azurerm_postgresql_flexible_server_database.app" and $recreate == "true")' >/dev/null
        if [ "$APPLY" = true ]; then
          terraform apply -input=false -no-color tfplan
        fi
    env:
      APPLY: ${{ parameters.apply }}
      RECREATE_DATABASE: ${{ parameters.recreateDatabase }}
      TF_VAR_postgres_admin_password: $(postgres-admin-password)
      TF_VAR_platform_admin_password: $(bootstrap-admin-password)
      TF_VAR_authentication_signing_key: $(authentication-signing-key)
      TF_VAR_azure_openai_endpoint: $(azure-openai-endpoint)
      TF_VAR_azure_openai_api_key: $(azure-openai-api-key)
